# Note: This crate must be built using do.sh

[package]
name = "raydium_amm"
version = "0.3.1"
description = "Raydium AMM"
authors = ["Raydium Maintainers "]
repository = "https://github.com/raydium-io/raydium-amm"
license = "Apache-2.0"
edition = "2021"

[features]
no-entrypoint = []
program = []
default = ["program"]
client = []
devnet = []
testnet = []

[lib]
name = "raydium_amm"
path = "../.source/raydium-amm/program/src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.2.1"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
spl-token = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "=6.0.0", features = [
    "no-entrypoint",
] }
solana-security-txt = "1.1.1"
serde_json = { version = "1.0.56" }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "1.3.3" }
base64 = "0.13.0"
arrayref = "0.3.6"
arrform = { git = "https://github.com/raydium-io/arrform", rev = "fdbb0cfe18eadbff99cc8cd63f1b5a43df70e665" }
num-derive = "0.3"
num-traits = "0.2.12"
bytemuck = { version = "1.4.0" }
safe-transmute = "0.11.0"
thiserror = "1.0.20"
uint = "0.10.0"
